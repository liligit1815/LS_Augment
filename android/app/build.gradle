plugins { id 'com.android.application' }

def versionFile = rootProject.file('version.properties')
if (!versionFile.isFile()) {
    throw new GradleException("Missing version source: ${versionFile.absolutePath}")
}

def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
def versionCodeText = versionProps.getProperty('versionCode', '').trim()
def appVersionName = versionProps.getProperty('versionName', '').trim()
int appVersionCode
try {
    appVersionCode = Integer.parseInt(versionCodeText)
} catch (NumberFormatException ignored) {
    throw new GradleException("Invalid versionCode in ${versionFile.absolutePath}: ${versionCodeText}")
}
if (appVersionCode <= 0 || !appVersionName.matches('^\\S+-test' + appVersionCode + '$')) {
    throw new GradleException(
            "versionName must end with test${appVersionCode}: ${appVersionName}")
}
println "Building LS_Augment ${appVersionName} (${appVersionCode})"

android {
    namespace 'ls.augment.com'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'ls.augment.com'
        minSdk 28
        targetSdk 36
        ndk {
            // The current RedMagic target and libinputreader are arm64. The
            // native feature fails closed on other ABIs while the APK keeps
            // all Java-only features available.
            abiFilters 'arm64-v8a'
        }
        versionCode appVersionCode
        versionName appVersionName

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fno-exceptions -fno-rtti'
            }
        }
    }

    // CI/local builds may inject the private development signing material via
    // environment variables. The key is deliberately not stored in source.
    def injectedStore = System.getenv('LS_AUGMENT_KEYSTORE')
    if (injectedStore != null && file(injectedStore).isFile()) {
        signingConfigs {
            lsAugmentDev {
                storeFile file(injectedStore)
                storeType 'PKCS12'
                storePassword System.getenv('LS_AUGMENT_STORE_PASSWORD') ?: 'lsaugment'
                keyAlias System.getenv('LS_AUGMENT_KEY_ALIAS') ?: 'ls_augment'
                keyPassword System.getenv('LS_AUGMENT_KEY_PASSWORD') ?:
                        (System.getenv('LS_AUGMENT_STORE_PASSWORD') ?: 'lsaugment')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (signingConfigs.findByName('lsAugmentDev') != null) {
                signingConfig signingConfigs.lsAugmentDev
            }
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    packagingOptions {
        jniLibs {
            // system_server loads the module-owned rapid-fire library from
            // ApplicationInfo.nativeLibraryDir during compatibility testing.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Modern libxposed API 102 is supplied by LSPosed/Vector at runtime.
    // Never package it into the LS_Augment APK.
    compileOnly 'io.github.libxposed:api:102.0.0'
}
