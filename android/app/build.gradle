plugins { id 'com.android.application' }

def verifyShellAssets = tasks.register('verifyShellAssets') {
    def scripts = fileTree('src/main/assets') { include '**/*.sh' }
    inputs.files(scripts)
    doLast {
        scripts.each { script ->
            def source = script.getText('UTF-8')
            if (source.contains('\r') || source.startsWith('\uFEFF')) {
                throw new GradleException("Shell asset must use UTF-8 without BOM and LF line endings: ${script.name}")
            }
        }
    }
}
tasks.named('preBuild') { dependsOn verifyShellAssets }

def versionFile = rootProject.file('version.properties')
if (!versionFile.isFile()) {
    throw new GradleException("Missing version source: ${versionFile.absolutePath}")
}

def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
def versionCodeText = versionProps.getProperty('versionCode', '').trim()
def appVersionName = versionProps.getProperty('versionName', '').trim()
int appVersionCode
try {
    appVersionCode = Integer.parseInt(versionCodeText)
} catch (NumberFormatException ignored) {
    throw new GradleException("Invalid versionCode in ${versionFile.absolutePath}: ${versionCodeText}")
}
if (appVersionCode <= 0 || !appVersionName.matches('^\\S+-test' + appVersionCode + '$')) {
    throw new GradleException(
            "versionName must end with test${appVersionCode}: ${appVersionName}")
}
println "Building LS_Augment ${appVersionName} (${appVersionCode})"

android {
    namespace 'ls.augment.com'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'ls.augment.com'
        minSdk 35
        targetSdk 36
        ndk {
            // The current RedMagic target and libinputreader are arm64. The
            // native feature fails closed on other ABIs while the APK keeps
            // all Java-only features available.
            abiFilters 'arm64-v8a'
        }
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner 'ls.augment.com.DeviceRegressionRunner'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fno-exceptions -fno-rtti'
            }
        }
    }

    // CI/local builds may inject the private development signing material via
    // environment variables. The key is deliberately not stored in source.
    def injectedStore = System.getenv('LS_AUGMENT_KEYSTORE')
    if (injectedStore != null && file(injectedStore).isFile()) {
        signingConfigs {
            lsAugmentDev {
                storeFile file(injectedStore)
                storeType 'PKCS12'
                storePassword System.getenv('LS_AUGMENT_STORE_PASSWORD') ?: 'lsaugment'
                keyAlias System.getenv('LS_AUGMENT_KEY_ALIAS') ?: 'ls_augment'
                keyPassword System.getenv('LS_AUGMENT_KEY_PASSWORD') ?:
                        (System.getenv('LS_AUGMENT_STORE_PASSWORD') ?: 'lsaugment')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (signingConfigs.findByName('lsAugmentDev') != null) {
                signingConfig signingConfigs.lsAugmentDev
            }
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        prefab true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    packagingOptions {
        jniLibs {
            // system_server loads the module-owned rapid-fire library from
            // ApplicationInfo.nativeLibraryDir during compatibility testing.
            useLegacyPackaging = true
        }
    }
}

// These hidden platform signatures are compile-only. The actual classes must
// resolve from system_server's attested services loader at runtime.
def compileObserverStubs = tasks.register('compileObserverStubs', JavaCompile) {
    source rootProject.fileTree('observer-stubs/src') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('observer-stubs/classes')
    options.release = 17
    options.encoding = 'UTF-8'
}
def observerStubsJar = tasks.register('observerStubsJar', Jar) {
    archiveFileName = 'observer-signatures.jar'
    destinationDirectory = layout.buildDirectory.dir('observer-stubs')
    from compileObserverStubs.flatMap { it.destinationDirectory }
}

dependencies {
    compileOnly files(observerStubsJar)
    // Modern libxposed API 102 is supplied by LSPosed/Vector at runtime.
    // Never package it into the LS_Augment APK.
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Scope APIs are available in service 101 and compatible with the API 102 framework.
    // Service 102 adds hot reload but requires compileSdk 37; keep this Android 36 build.
    implementation 'io.github.libxposed:service:101.0.0'
}
