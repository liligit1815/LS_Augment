plugins { id 'com.android.application' }

def verifyShellAssets = tasks.register('verifyShellAssets') {
    def scripts = fileTree('src/main/assets') { include '**/*.sh' }
    inputs.files(scripts)
    doLast {
        scripts.each { script ->
            def source = script.getText('UTF-8')
            if (source.contains('\r') || source.startsWith('\uFEFF')) {
                throw new GradleException("Shell asset must use UTF-8 without BOM and LF line endings: ${script.name}")
            }
        }
    }
}
tasks.named('preBuild') { dependsOn verifyShellAssets }

// Always capture the live website at build time. Never silently package stale names.
def contributorAssets = tasks.register('syncContributorPage') {
    def destination = layout.buildDirectory.file('generated/contributorAssets/contributors/index.html')
    outputs.file(destination)
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    doLast {
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
        def resources = factory.newDocumentBuilder().parse(file('src/main/res/values/contributors.xml'))
        def strings = resources.getElementsByTagName('string')
        def address = ''
        for (int i = 0; i < strings.length; i++) {
            if (strings.item(i).getAttribute('name') == 'contributors_page_url') {
                address = strings.item(i).textContent.trim()
            }
        }
        if (!address) throw new GradleException('Set contributors_page_url to the deployed HTTPS website before building. A live webpage snapshot is required.')
        java.net.HttpURLConnection request = null
        try {
            def uri = new URI(address)
            if (!'https'.equalsIgnoreCase(uri.scheme) || !uri.host || uri.userInfo || uri.fragment) {
                throw new IOException('A direct HTTPS URL is required')
            }
            request = (java.net.HttpURLConnection) uri.toURL().openConnection()
            request.connectTimeout = 10000
            request.readTimeout = 10000
            request.instanceFollowRedirects = false
            request.setRequestProperty('Accept', 'text/html')
            request.setRequestProperty('Cache-Control', 'no-cache')
            if (request.responseCode != 200) throw new IOException("HTTP ${request.responseCode}; use the final URL without redirects")
            if (!request.contentType?.toLowerCase(Locale.ROOT)?.startsWith('text/html')) {
                throw new IOException('Expected text/html')
            }
            def bytes = new ByteArrayOutputStream()
            request.inputStream.withCloseable { input ->
                byte[] buffer = new byte[4096]
                int count
                while ((count = input.read(buffer)) != -1) {
                    if (bytes.size() + count > 512 * 1024) throw new IOException('Page exceeds 512 KiB')
                    bytes.write(buffer, 0, count)
                }
            }
            def html = bytes.toString('UTF-8')
            if (!html.contains('<meta name="redmagic-duo-contributors" content="1">') || !html.contains('</html>')) {
                throw new IOException('Missing contributor page marker or incomplete HTML')
            }
            def target = destination.get().asFile
            target.parentFile.mkdirs()
            java.nio.file.Files.write(target.toPath(), bytes.toByteArray())
            logger.lifecycle('Captured current contributor website for offline use.')
        } catch (Exception error) {
            throw new GradleException('Unable to capture the contributor website. Build stopped instead of packaging an old or local list.', error)
        } finally {
            request?.disconnect()
        }
    }
}
tasks.named('preBuild') { dependsOn contributorAssets }

def versionFile = rootProject.file('version.properties')
if (!versionFile.isFile()) {
    throw new GradleException("Missing version source: ${versionFile.absolutePath}")
}

def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
def versionCodeText = versionProps.getProperty('versionCode', '').trim()
def appVersionName = versionProps.getProperty('versionName', '').trim()
int appVersionCode
try {
    appVersionCode = Integer.parseInt(versionCodeText)
} catch (NumberFormatException ignored) {
    throw new GradleException("Invalid versionCode in ${versionFile.absolutePath}: ${versionCodeText}")
}
if (appVersionCode <= 0 || !appVersionName.matches('^\\S+-test' + appVersionCode + '$')) {
    throw new GradleException(
            "versionName must end with test${appVersionCode}: ${appVersionName}")
}
println "Building 红魔Duo ${appVersionName} (${appVersionCode})"

android {
    namespace 'ls.augment.com'
    compileSdk 36
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'ls.augment.com'
        minSdk 35
        targetSdk 36
        ndk {
            // The current RedMagic target and libinputreader are arm64. The
            // native feature fails closed on other ABIs while the APK keeps
            // all Java-only features available.
            abiFilters 'arm64-v8a'
        }
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner 'ls.augment.com.DeviceRegressionRunner'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fno-exceptions -fno-rtti'
            }
        }
    }

    // CI/local builds may inject the private development signing material via
    // environment variables. The key is deliberately not stored in source.
    def localSigningFile = rootProject.file('../.signing/signing.local.json')
    def localSigning = localSigningFile.isFile() ? new groovy.json.JsonSlurper().parse(localSigningFile) : [:]
    def configuredStore = localSigning.keystore ? new File(localSigning.keystore.toString()) : null
    if (configuredStore != null && !configuredStore.isFile()) {
        configuredStore = rootProject.file('../.signing/' + localSigning.keystore.toString().replace('\\', '/').tokenize('/').last())
    }
    def injectedStore = System.getenv('LS_AUGMENT_KEYSTORE') ?: (configuredStore?.isFile() ? configuredStore.absolutePath : null)
    if (injectedStore != null && file(injectedStore).isFile()) {
        signingConfigs {
            lsAugmentDev {
                storeFile file(injectedStore)
                storeType 'PKCS12'
                storePassword System.getenv('LS_AUGMENT_STORE_PASSWORD') ?: localSigning.storePassword ?: 'lsaugment'
                keyAlias System.getenv('LS_AUGMENT_KEY_ALIAS') ?: localSigning.keyAlias ?: 'ls_augment'
                keyPassword System.getenv('LS_AUGMENT_KEY_PASSWORD') ?:
                        (localSigning.keyPassword ?: System.getenv('LS_AUGMENT_STORE_PASSWORD') ?: localSigning.storePassword ?: 'lsaugment')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (signingConfigs.findByName('lsAugmentDev') != null) {
                signingConfig signingConfigs.lsAugmentDev
            }
        }
        release {
            minifyEnabled false
            debuggable false
            if (signingConfigs.findByName('lsAugmentDev') != null) {
                signingConfig signingConfigs.lsAugmentDev
            }
        }
    }
    tasks.matching { it.name == 'preBuild' || it.name == 'validateSigningDebug' || it.name == 'validateSigningRelease' }.configureEach {
        doFirst {
            if (injectedStore == null || !file(injectedStore).isFile()) throw new GradleException('Historical signing material is required; refusing an unsigned APK or fallback debug signature.')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        prefab true
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/contributorAssets'))

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    packagingOptions {
        jniLibs {
            // system_server loads the module-owned rapid-fire library from
            // ApplicationInfo.nativeLibraryDir during compatibility testing.
            useLegacyPackaging = true
        }
    }
}

// These hidden platform signatures are compile-only. The actual classes must
// resolve from system_server's attested services loader at runtime.
def compileObserverStubs = tasks.register('compileObserverStubs', JavaCompile) {
    source rootProject.fileTree('observer-stubs/src') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('observer-stubs/classes')
    options.release = 17
    options.encoding = 'UTF-8'
}
def observerStubsJar = tasks.register('observerStubsJar', Jar) {
    archiveFileName = 'observer-signatures.jar'
    destinationDirectory = layout.buildDirectory.dir('observer-stubs')
    from compileObserverStubs.flatMap { it.destinationDirectory }
}

def libxposedApiVersion = '102.0.0'
// Test fixtures only need Chain's bytecode. Resolving the AAR as an Android test
// dependency also imports API 102's minCompileSdk 37 metadata, although the
// exercised Java signatures compile against this project's Android 36 SDK.
def instrumentationXposedApiAar = configurations.create('instrumentationXposedApiAar') {
    canBeResolved = true
    canBeConsumed = false
    transitive = false
    attributes {
        attribute(org.gradle.api.attributes.Category.CATEGORY_ATTRIBUTE,
                objects.named(org.gradle.api.attributes.Category, org.gradle.api.attributes.Category.LIBRARY))
        attribute(org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
                objects.named(org.gradle.api.attributes.Usage, org.gradle.api.attributes.Usage.JAVA_API))
        attribute(org.gradle.api.attributes.LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
                objects.named(org.gradle.api.attributes.LibraryElements, 'aar'))
    }
}
def instrumentationXposedApiJar = layout.buildDirectory.file('instrumentation-api/libxposed-api-' + libxposedApiVersion + '.jar')
def extractInstrumentationXposedApiJar = tasks.register('extractInstrumentationXposedApiJar') {
    inputs.property('apiVersion', libxposedApiVersion)
    inputs.files(instrumentationXposedApiAar).withPropertyName('apiAar').withPathSensitivity(PathSensitivity.NONE)
    outputs.file(instrumentationXposedApiJar)
    doLast {
        new java.util.zip.ZipFile(instrumentationXposedApiAar.singleFile).withCloseable { archive ->
            def entry = archive.getEntry('classes.jar')
            if (entry == null) throw new GradleException('The pinned libxposed API AAR does not contain classes.jar')
            def target = instrumentationXposedApiJar.get().asFile
            target.parentFile.mkdirs()
            archive.getInputStream(entry).withCloseable { input ->
                java.nio.file.Files.copy(input, target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}
def instrumentationXposedApiClasses = files(instrumentationXposedApiJar).builtBy(extractInstrumentationXposedApiJar)

dependencies {
    compileOnly files(observerStubsJar)
    // Modern libxposed API 102 is supplied by LSPosed/Vector at runtime.
    // Never package it into the LS_Augment APK.
    compileOnly "io.github.libxposed:api:${libxposedApiVersion}"
    // Instrumentation exercises the real Chain API; production still relies on the framework.
    add(instrumentationXposedApiAar.name, "io.github.libxposed:api:${libxposedApiVersion}")
    androidTestImplementation instrumentationXposedApiClasses
    // Scope APIs are available in service 101 and compatible with the API 102 framework.
    // Service 102 adds hot reload but requires compileSdk 37; keep this Android 36 build.
    implementation 'io.github.libxposed:service:101.0.0'
}
